<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pappankulam Ayathi</title><style>body{font-family:Arial;padding:6px;background:#fff8e1;margin:0}h2{background:#000;color:yellow;padding:10px;text-align:center;margin:0}input,select{width:100%;padding:12px;border:2px solid #000;border-radius:8px;margin:4px 0;font-weight:bold;box-sizing:border-box}.box{border:2px solid #000;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.good{background:#c8e6c9;border:3px solid green;padding:10px;text-align:center;font-weight:bold}.bad{background:#ffcdd2;border:3px solid red;padding:10px;text-align:center;font-weight:bold}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}button{padding:12px;font-weight:bold;border:2px solid #000;border-radius:8px}</style></head><body><h2>🛕 PAPPAANKULAM KAATU MARIYAMMAN<br>AYATHI CALCULATOR - FREE</h2><div class="box"><label>அடி - 7'11"=7.91</label><input id="ft" type="number" value="7.91" step="0.01" oninput="calc()"><div class="grid2"><div><label>இஞ்ச்</label><input id="inch" type="number" value="95" oninput="calc2()"></div><div><label>பெயர்</label><select id="n" onchange="calc()"><option>வீரமணி</option><option>மாரிமுத்து</option></select></div></div></div><div class="box" id="out"></div><div class="box"><div class="grid2"><button style="background:#000;color:#fff" onclick="setVal(7.91)">7'11" KARUVARAI</button><button style="background:#000;color:#fff" onclick="setVal(5.91)">5'11" ARTHA</button></div><div class="grid2"><button style="background:#b71c1c;color:#fff" onclick="setVal(45)">MAHA 45'</button><button style="background:#2e7d32;color:#fff" onclick="setVal(36)">MAHA 36'</button></div></div><script>function setVal(v){document.getElementById('ft').value=v;calc();}function calc(){let f=parseFloat(document.getElementById('ft').value)||0;let i=Math.round(f*12);document.getElementById('inch').value=i;doCalc(i);}function calc2(){let i=parseFloat(document.getElementById('inch').value)||0;document.getElementById('ft').value=(i/12).toFixed(2);doCalc(i);}function doCalc(inch){let a=inch*8%12;if(a==0)a=12;let v=inch*9%10;if(v==0)v=10;let y=inch*3%8;if(y==0)y=8;let nc=inch*8%27;if(nc==0)nc=27;let t=nc%9;if(t==0)t=9;let ym={1:"1 துவஜம் ✅",2:"2 தூமம் ❌",3:"3 சிம்மம் ✅",4:"4 சுவானம் ❌",5:"5 விருஷபம் ✅",6:"6 கர்தபம் ❌",7:"7 கஜம் ✅✅ SUPER",8:"8 காகம் ❌"};let tm={1:"1 ஜென்மம் ❌",2:"2 சம்பத் ✅",3:"3 விபத் ❌",4:"4 ஷேமம் ✅",5:"5 பிரத்யக்கு ❌",6:"6 சாதனை ✅",7:"7 நைதனம் ❌",8:"8 மித்ரம் ✅",9:"9 அதிமித்ரம் ✅✅ BEST"};let ok=(t==2||t==4||t==6||t==8||t==9)&&(y==1||y==3||y==5||y==7);document.getElementById('out').innerHTML=`<b>${inch}" = ${Math.floor(inch/12)}' ${inch%12}" = ${(inch/12).toFixed(2)}'</b><hr>ஆயம்:${a} ${a>=v?"✅":"❌"}<br>வியயம்:${v}<br>யோனி:${y}=${ym[y]}<br>நட்ச:${nc}/27<br>தாரை:${t}=${tm[t]}<hr><div class="${ok?'good':'bad'}">${ok?'✅ உத்தமம் SUPER BEST!':'❌ அதமம் - மாத்துங்க!'}</div>`;}window.onload=calc;</script></body></html>
